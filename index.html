<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1220" />
    <meta name="theme-color" content="#F2633D" media="(prefers-color-scheme: light)" />
    <meta name="description" content="toolmd — bộ công cụ document, Markdown và developer chạy riêng tư trong trình duyệt." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#F2633D" />
    <script>
      if (localStorage.getItem("toolmd-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>toolmd — focused browser tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
